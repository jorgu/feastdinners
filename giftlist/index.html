<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a90000">
  <title>Presentlista 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Julklappar & presenter</p>
      <h1>2026</h1>
    </header>

    <section class="toolbar" aria-label="Filtrera listan">
      <label class="search-label" for="search">Sök i listan</label>
      <input id="search" type="search" placeholder="Sök mottagare, present eller butik…">
      <div class="filters" role="group" aria-label="Visa listtyp">
        <button class="filter-button active" type="button" data-filter="Alla" aria-pressed="true">Alla</button>
        <button class="filter-button" type="button" data-filter="Julklapp" aria-pressed="false">Julklappar</button>
        <button class="filter-button" type="button" data-filter="Födelsedag" aria-pressed="false">Födelsedag</button>
      </div>
    </section>

    <div id="lists" aria-live="polite"></div>
    <p id="empty-state" class="empty-state" hidden>Inga presenter matchar sökningen.</p>
    <footer>Presentlista · 2026</footer>
  </main>
</body>
</html>
